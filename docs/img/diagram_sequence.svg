<text x="890" y="474" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">X Y Z [mm], RZ [deg]</text>
