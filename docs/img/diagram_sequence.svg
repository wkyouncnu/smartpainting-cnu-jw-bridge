<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 666" width="1100" height="666">
<defs><marker id="mdb2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="mdb2777s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#db2777"/></marker><marker id="m16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="m16a34as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="550" y="32" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">TCP 시퀀스 — JW(클라이언트)가 묻고, CN(우리, 서버)이 답한다</text>
