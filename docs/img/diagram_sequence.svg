<text x="890" y="338" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">1 이 나올 때까지</text>
<line x1="870" y1="368" x2="232" y2="368" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
<text x="551.0" y="361.0" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="normal" fill="#16a34a" text-anchor="middle">$CN,3,1,REQ_ORIGIN_INIT,2,1,0</text>
<text x="890" y="372" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">1 = 반영 완료</text>
<rect x="60" y="384" width="980" height="28" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
<text x="550" y="403" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="bold" fill="#854d0e" text-anchor="middle">정상 운용 — 아래 한 쌍을 100 Hz (10 ms) 로 반복</text>
