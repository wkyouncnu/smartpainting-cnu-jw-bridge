<text x="549.0" y="191.0" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="normal" fill="#db2777" text-anchor="middle">$JW,1,1,GET_VERSION,1,100</text>
<text x="890" y="202" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">버전 1.00</text>
<line x1="870" y1="232" x2="232" y2="232" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
<text x="551.0" y="225.0" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="normal" fill="#16a34a" text-anchor="middle">$CN,1,1,GET_VERSION,1,100</text>
<line x1="230" y1="266" x2="868" y2="266" stroke="#db2777" stroke-width="2" marker-end="url(#mdb2777)"/>
<text x="549.0" y="259.0" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="normal" fill="#db2777" text-anchor="middle">$JW,2,1,GET_LOCALIZATION_STATUS,0</text>
<text x="890" y="270" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="11" font-weight="normal" fill="#475569" text-anchor="start">2 가 나올 때까지 1 s 마다</text>
