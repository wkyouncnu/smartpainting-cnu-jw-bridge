<text x="549.0" y="497.0" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="normal" fill="#db2777" text-anchor="middle">$JW,5,1,GET_CUR_MPOS,0</text>
<line x1="870" y1="538" x2="232" y2="538" stroke="#16a34a" stroke-width="2" marker-end="url(#m16a34a)"/>
<text x="551.0" y="531.0" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="normal" fill="#16a34a" text-anchor="middle">$CN,5,1,GET_CUR_MPOS,4,-2675,-878,520,0.12</text>
<text x="550" y="572" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="normal" fill="#475569" text-anchor="middle">⋮</text>
<text x="550" y="644" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle">응답의 SEQ 는 요청의 SEQ 를 그대로 쓴다 · 응답 지연 100 ms 경고 / 300 ms 값 무효 / 1000 ms 두절 → 재접속</text>
