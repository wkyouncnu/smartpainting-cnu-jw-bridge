<text x="230" y="81" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">JW 통합제어기 (Client)</text>
<rect x="750" y="52" width="240" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="870" y="81" font-family="'Malgun Gothic','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">CN mpos_server (Server :5010)</text>
<line x1="230" y1="98" x2="230" y2="616" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
